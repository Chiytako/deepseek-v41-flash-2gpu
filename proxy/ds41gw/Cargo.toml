[package]
name = "ds41gw"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "API conversion gateway in front of ds41rt (OpenAI Chat / Responses / Anthropic Messages / legacy completions)"
publish = false

[lib]
name = "ds41gw"
path = "src/lib.rs"

[[bin]]
name = "ds41gw"
path = "src/main.rs"

[dependencies]
# ds41rt と同じ版に固定する (r7_proxy_spec.md §2.4)。中身は下の [patch.crates-io] で数値 effort 対応版に差し替える
deepseek-recipe = "=0.1.0"
deepseek-recipe-core = "=0.1.0"
deepseek-recipe-encoding = "=0.1.0"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
# 受信側の http1 を直に組む (ヘッダの読み取りの時間切れのため。axum::serve は timer を渡さない)。版は axum が使うものと同じ
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = { version = "0.13", default-features = false }
flate2 = "1"

# reasoning effort の数値 (1〜100) 対応版 (ds41rt 改修版と同じもの)。vendor/deepseek-recipe-patched/README.md を参照
[patch.crates-io]
deepseek-recipe = { path = "../vendor/deepseek-recipe-patched/deepseek-recipe" }
deepseek-recipe-core = { path = "../vendor/deepseek-recipe-patched/deepseek-recipe-core" }
deepseek-recipe-encoding = { path = "../vendor/deepseek-recipe-patched/deepseek-recipe-encoding" }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
lto = "thin"
codegen-units = 4
